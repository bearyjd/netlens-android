name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Literal control characters in a source file make git and grep treat it as BINARY. The
      # file then silently disappears from grep, from `git diff` (shown as "Bin N -> M bytes"),
      # and from any grep-based audit or security scan — coverage that exists looks absent.
      # U+202A-202E / U+2066-2069 are the Trojan Source (CVE-2021-42574) bidi overrides, which
      # additionally make rendered source differ from what compiles.
      #
      # This is a CI gate rather than a convention because a convention did not hold: the same
      # mistake was made twice within one session, the second time by someone who had just
      # fixed the first. Write control characters as Kotlin escapes such as \u0000 in test fixtures.
      #
      # -a is load-bearing. Without it grep classifies the offending file as binary and
      # SUPPRESSES the match, so the check passes on exactly the files it exists to catch.
      - name: Reject literal control characters in source
        run: |
          pattern='[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]|\x{202A}|\x{202B}|\x{202C}|\x{202D}|\x{202E}|\x{2066}|\x{2067}|\x{2068}|\x{2069}'
          offenders=$(git ls-files -z '*.kt' '*.kts' '*.java' '*.xml' '*.yml' '*.yaml' \
            | xargs -0 grep -alP "$pattern" 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "::error::Literal control or bidi characters found. Use escapes (\\u0000) instead:"
            echo "$offenders" | sed 's/^/  /'
            exit 1
          fi
          echo "No literal control characters in tracked source."

      - name: Build debug APK
        run: ./gradlew assembleFossDebug

      - name: Run unit tests
        # :app is the only flavored module, so it needs one task per flavor; the library modules
        # expose testDebugUnitTest. The three names don't overlap, so nothing runs twice.
        #
        # testGplayDebugUnitTest is not optional padding. app/src/testGplay/ holds
        # GplayProStatusTest — 12 tests over the purchase path, the reconnect cap,
        # ITEM_ALREADY_OWNED and purchase acknowledgement — and it was written but never run
        # here, because neither testFossDebugUnitTest (src/test + src/testFoss) nor
        # testDebugUnitTest (the unflavored library modules) reaches src/testGplay. Green tests
        # that CI never executes are worse than no tests: they read as coverage and enforce
        # nothing. Do not drop this task to save time.
        run: ./gradlew testFossDebugUnitTest testGplayDebugUnitTest testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: "**/build/test-results/**/TEST-*.xml"
          retention-days: 14

  # Nothing else in CI compiles a release variant: build-and-test runs assembleFossDebug, and
  # release.yml's assembleRelease runs only on a tag push. So R8, resource shrinking and
  # lintVital were unexercised until the moment of tagging — a break in any of them surfaced
  # first as a failed release, which is exactly the class of incident the android-release
  # skill's pre-flight exists to prevent.
  #
  # It is also the only job that builds the gplay flavor's *release* variant, so R8 on the
  # billing code is exercised here and nowhere else. gplay's Kotlin is compiled by the unit-test
  # step above too, now that it runs testGplayDebugUnitTest.
  #
  # Runs as its own job so the debug/test feedback loop keeps its current wall-clock.
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Both flavors, matching what release.yml actually builds at tag time: gplay pulls in
      # Play Billing and security-crypto that foss does not, so the two can diverge under R8.
      #
      # Deliberately unsigned — no RELEASE_* secrets are exposed here. app/build.gradle.kts
      # applies signingConfig only when storeFile resolves, so this produces *-unsigned.apk and
      # still exercises everything that matters: compileReleaseKotlin, R8, resource shrinking
      # and lintVital. Signing itself is already proven separately by dispatching release.yml.
      # assembleRelease *and* bundleRelease, matching release.yml's step verbatim. The AAB is
      # what Play Console consumes and its packaging can fail independently of the APK; since
      # both share compileReleaseKotlin and R8, adding it costs the bundling step alone rather
      # than a second build.
      - name: Build release APKs and AABs (unsigned) to exercise R8 and lintVital
        run: ./gradlew assembleRelease bundleRelease

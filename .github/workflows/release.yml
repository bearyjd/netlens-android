name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_production:
        description: "Publish this tagged release to Google Play production after Release succeeds"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4

      - name: Verify tag matches gradle version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep '^netlens.versionName=' gradle.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match gradle.properties ($GRADLE_VERSION)"
            exit 1
          fi

      - name: Guard against shadowing local.properties
        run: |
          if [ -f local.properties ]; then
            echo "::error::local.properties is present in CI checkout and would shadow env-based signing"
            exit 1
          fi

      - name: Decode and validate release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 secret is not set}"
          : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is not set}"
          : "${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS secret is not set}"
          : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is not set}"
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/keystore/release.keystore" \
                  -storepass "$RELEASE_STORE_PASSWORD" \
                  -alias "$RELEASE_KEY_ALIAS" >/dev/null
          keytool -list -v -keystore "$RUNNER_TEMP/keystore/release.keystore" \
                  -storepass "$RELEASE_STORE_PASSWORD" \
                  -alias "$RELEASE_KEY_ALIAS" \
            | grep -E 'Owner|Issuer|SHA256|Valid until' || true
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netlens-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/bundle/*Release/*.aab
          retention-days: 90

      # Google Play re-signs production builds with its app-signing key. The APKs
      # built above use the upload key, so publishing either kind of Android binary
      # here creates an install that can never update through Play. Keep public
      # releases to notes; authenticated CI artifacts remain available to maintainers.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true

  # A human-created v* tag is the explicit production-deployment signal. The
  # bump workflow dispatches this workflow with publish_production=true because
  # GITHUB_TOKEN tag pushes do not otherwise trigger tag workflows.
  publish-production:
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.publish_production == true)
    uses: ./.github/workflows/play-publish.yml
    with:
      track: production
      release_status: completed
      production_automation: true
    secrets: inherit

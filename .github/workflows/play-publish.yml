name: Play Publish

# Reusable signed gplay AAB publisher. Release calls this for production only
# after its tagged release job succeeds. Manual dispatch remains available for
# deliberate non-production track testing.
on:
  workflow_call:
    inputs:
      track:
        required: true
        type: string
      release_status:
        required: true
        type: string
      production_automation:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        default: "internal"
        type: choice
        options: [internal, alpha, beta]
      release_status:
        description: "Release status"
        default: "draft"
        type: choice
        options: [draft, completed]

permissions:
  contents: read

concurrency:
  group: play-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Reject manual production publishing
        if: inputs.track == 'production' && inputs.production_automation != true
        run: |
          echo "::error::Production publishing is automatic from the tagged Release workflow. Manual Play Publish is limited to test tracks."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Guard against shadowing local.properties
        run: |
          if [ -f local.properties ]; then
            echo "::error::local.properties is present in CI checkout and would shadow env-based signing"
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 secret is not set}"
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed gplay AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleGplayRelease

      - name: Write Play service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          : "${PLAY_SERVICE_ACCOUNT_JSON_DATA:?PLAY_SERVICE_ACCOUNT_JSON secret is not set}"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_DATA" > "$RUNNER_TEMP/play.json"
          echo "PLAY_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"

      - name: Upload to Play (${{ inputs.track }} / ${{ inputs.release_status }})
        run: bundle exec fastlane deploy track:"${{ inputs.track }}" release_status:"${{ inputs.release_status }}"
